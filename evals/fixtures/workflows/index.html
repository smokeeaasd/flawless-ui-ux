<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team directory fixture</title>
<style>body{font:16px/1.5 system-ui,sans-serif;color:#182125;background:#f3f6f7;margin:24px}main{max-width:680px;margin:auto}button,input{font:inherit;padding:10px}button{cursor:pointer}dialog{max-width:360px;border:1px solid #64747b;border-radius:8px;padding:24px}label,input{display:block;margin-block:12px}input{max-width:90%}button:focus-visible,input:focus-visible{outline:3px solid #1256bd;outline-offset:3px}</style></head>
<body><main><h1>Team directory</h1><p>Review a member's contact name. This fixture changes local presentation only.</p><h2 id="member-display">Avery Chen</h2><button id="edit-member">Edit member</button></main>
<dialog id="member-editor" aria-labelledby="editor-title"><h2 id="editor-title">Edit member</h2><label for="member-name">Display name</label><input id="member-name" value="Avery Chen"><button id="close-editor">Cancel</button></dialog>
<script>const editor=document.querySelector('#member-editor');document.querySelector('#edit-member').addEventListener('click',()=>{editor.showModal();document.querySelector('#member-name').focus()});document.querySelector('#close-editor').addEventListener('click',()=>editor.close());</script></body></html>
