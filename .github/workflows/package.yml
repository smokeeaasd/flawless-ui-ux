name: Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-installation:
    name: package-and-installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: bun install --frozen-lockfile
      - name: Prepare test browser (Linux)
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium
      - name: Prepare test browser (Windows)
        if: runner.os == 'Windows'
        run: bunx playwright install chromium
      - name: Validate package and installation
        run: bun test
        env:
          FLAWLESS_TEST_BROWSER: '1'
