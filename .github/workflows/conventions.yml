name: Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate branch, commits, and pull request title
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import os
          import re
          import subprocess
          import sys

          types = r"(?:feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)"
          branch_pattern = re.compile(types + r"/[a-z0-9]+(?:-[a-z0-9]+)*")
          subject_pattern = re.compile(types + r"(?:\([a-z0-9][a-z0-9._/-]*\))?!?: \S[^\r\n]*")
          errors = []

          if not branch_pattern.fullmatch(os.environ["BRANCH_NAME"]):
              errors.append("Use a Conventional Branch: <type>/<kebab-case-description>.")
          if not subject_pattern.fullmatch(os.environ["PR_TITLE"]):
              errors.append("Use a Conventional Commit subject as the pull request title.")

          revision_range = os.environ["BASE_SHA"] + ".." + os.environ["HEAD_SHA"]
          commits = subprocess.check_output(
              ["git", "log", "--format=%H%x00%s", revision_range], text=True
          ).splitlines()
          if not commits:
              errors.append("The pull request must contain at least one commit.")
          for commit in commits:
              sha, subject = commit.split("\0", 1)
              if not subject_pattern.fullmatch(subject):
                  errors.append("Commit " + sha[:12] + " must use Conventional Commits.")

          for error in errors:
              print(error, file=sys.stderr)
          if errors:
              sys.exit(1)
          print("Branch, commits, and pull request title follow the repository conventions.")
